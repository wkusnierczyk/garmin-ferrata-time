# Build verification (#10), cut down from Climber Time's build.yml
# (wkusnierczyk/garmin-climber-time#5), itself from Matrix Time's. Every push to main or a dev-*
# release branch, and every pull request from this repository (not a fork's, below), compiles both
# apps, Ferrata and Ferrata Demo (#140), for one product per device family, the set derived at run
# time from manifest.xml and the image's device definitions (tools/ci-devices.py, #11). The build job
# also compiles the replay variant (#57). The store bundle (#12) and the checks that need no SDK (#14)
# come later. Beside the build: the unit tests, in all three builds, in the same container under a
# virtual display (#13, #46); the tools' tests with the route files checked against their sources and
# the two manifests against each other (#47, #57, #140); and the launcher icons checked (#133), these
# two on the runner.
#
# A container, because the device definitions monkeyc compiles against are not in the public SDK
# download: the SDK manager pulls them behind a Garmin sign-in, so they arrive in an image. The image
# is our own, ghcr.io/wkusnierczyk/connectiq-tester (wkusnierczyk/connectiq-tester, after
# matco/connectiq-tester; wkusnierczyk/garmin-watch-faces#37). Tag 9.3.0-2026-11-16: SDK 9.3.0,
# 94 device definitions. A product added to manifest.xml that the image lacks fails the build job
# (tools/ci-devices.py names it) and needs a rebuilt resources image.
#
# It is a PRIVATE package. The job logs in to ghcr.io with the run's GITHUB_TOKEN, which needs
# packages: read (below), and the package's settings grant this repository read access ("Manage
# Actions access"). A fork's pull request is not granted that access here, so the job is skipped for
# one (its if:), where it would only fail at the pull: a choice, since a package could be shared with
# forks too.
#
# Pinned by digest, with the tag trailing: a tag is mutable, and a retag would swap the build
# environment with no diff here to show it.
#
# No developer key. monkeyc accepts any key, so the job signs with a throwaway one generated per run;
# the real key is the identity the published app is signed with and stays out of GitHub.
name: build

on:
  push:
    branches: [main, 'dev-*']
  pull_request:

# Read the repository, and pull the private tester image; nothing else.
permissions:
  contents: read
  packages: read

jobs:
  # The tools' tests (the route tool, #47; the replay tool, #57), the route files current with
  # their sources, and the two apps' manifests in step (#140). Its own job on the runner, not a step
  # in the build's container: the tester image has no Python. The replay tool needs Garmin's FIT
  # SDK, which apt does not carry, so pytest and it go into a virtual environment from
  # tools/requirements.txt rather than into the runner's system Python. make routes and make
  # check-manifests need nothing beyond Python 3, and run on the system's.
  routes:
    name: routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Test the tools, check make routes changes nothing, and check the manifests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r tools/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m pytest tools/tests -v
          make routes
          git diff --exit-code -- resources/routes
          test -z "$(git status --porcelain -- resources/routes)"
          make check-manifests

  # The launcher icons (#133): both apps' icons and their mappings in monkey.jungle and demo.jungle,
  # README.md's table, and every icon's pixels against tools/launcher_icon.py's drawing. On the runner,
  # as Climber Time runs its own: the tester image has no Python packages. garmin-graphics-generator is
  # not on PyPI, so it is installed from GitHub; only its icons command runs, which imports Pillow and
  # nothing else, so it goes in without its dependencies (rembg and onnxruntime are hundreds of
  # megabytes the check never loads). Pinned to a commit SHA, with the release trailing, for the
  # reason the actions are; Pillow to the version the icons were drawn with. Keep them in step with
  # GRAPHICS_TOOL_VERSION and GRAPHICS_PILLOW_VERSION in the Makefile. rsvg-convert (librsvg2-bin)
  # draws the SVG the pixels are checked against. A venv, because the runner's Python is externally
  # managed; make runs the tool through it as GRAPHICS_PYTHON. No device definitions here, so the
  # mapping is checked against the manifests, not the definitions' icon sizes.
  icons:
    name: launcher icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - name: Install rsvg-convert and garmin-graphics-generator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          # Printed because the pixels are compared byte for byte with what this rsvg-convert draws,
          # and librsvg2-bin is ubuntu-latest's, not pinned: a red here with no change in the
          # repository may be librsvg drift, not a wrong icon. Compare this version with a green run's.
          rsvg-convert --version
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet --no-deps \
            'garmin-graphics-generator @ git+https://github.com/wkusnierczyk/garmin-graphics-generator@9d37f5487d3684452cc468a8944bc83132277040'  # v0.8.1
          "$RUNNER_TEMP/tools/bin/pip" install --quiet Pillow==11.3.0

      - name: Check the launcher icons
        run: make check-icons GRAPHICS_PYTHON="$RUNNER_TEMP/tools/bin/python"

  build:
    name: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    container:
      image: ghcr.io/wkusnierczyk/connectiq-tester@sha256:43c0f915cf5dbb721c87dabf36bcb0109ce33d42414e05c9472b53bc0b14914e  # 9.3.0-2026-11-16
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The image is ubuntu:jammy plus the SDK. make, because make is how the build is spelled
      # everywhere else (calling monkeyc here would be a second copy of its flags); git, so checkout
      # clones rather than downloads a tarball; git-lfs, without which lfs: true fails outright;
      # python3 for tools/ci-devices.py, named though the image has it, since it arrives only as a
      # dependency of the simulator's GTK stack and a slimmer image would drop it.
      - name: Install make, git, git-lfs and python3
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make git git-lfs python3

      # lfs: true, because the launcher icon is an LFS object: without it a pointer file sits where
      # the .png should be, and monkeyc compiles it without a word. Pinned to a commit SHA with the
      # release trailing, for the reason the image is pinned by digest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - name: Generate a throwaway signing key
        run: |
          openssl genrsa -out /tmp/ci_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in /tmp/ci_key.pem -out /tmp/ci_key -nocrypt

      # HOME, because the image keeps the device definitions in /root/.Garmin/ConnectIQ/Devices and a
      # container job runs with HOME=/github/home; monkeyc and tools/ci-devices.py find them by
      # expanding ~.
      #
      # Both apps, one product per device family (#11): resource qualifiers resolve per family, so
      # that compiles every resolution either app ships. The product is the family's lowest Connect IQ
      # version, so an API too new for the oldest watch fails here; make export (#12, to come) builds
      # every product. Ferrata Demo (#140) is the same source under its own manifest (demo.jungle,
      # manifest-demo.xml), with the same products (make check-manifests) and its own icons, published
      # on its own, so it is built for each family too.
      #
      # The set is resolved into a variable first, under bash's -e, so a failure to resolve it stops
      # the step; read straight into the loop from a process substitution, its exit status would be
      # lost and the step would build nothing and pass (playbook, reference/ci.md). The empty-set guard
      # is the other half of that rule. Past that, every build runs even after one fails, so a run
      # reports all the damage: a make in an if condition is exempt from -e.
      - name: Build both apps for one product per device family
        shell: bash
        env:
          HOME: /root
        run: |
          devices=$(python3 tools/ci-devices.py)
          test -n "$devices" || { echo "::error::no device families resolved"; exit 1; }
          echo "Building $(echo "$devices" | wc -l) families:"
          echo "$devices"

          mkdir -p bin
          status=0
          while read -r family device; do
            for demo in "" 1; do
              out="bin/$device${demo:+-demo}.prg"
              echo "::group::$family -- $device${demo:+ (Ferrata Demo)}"
              if make build DEMO=$demo DEVICE="$device" SDK_BIN=/connectiq/bin \
                            DEV_KEY=/tmp/ci_key OUTPUT="$out"; then
                ls -l "$out"
              else
                echo "::error::build failed for $device ($family)${demo:+, Ferrata Demo}"
                status=1
              fi
              echo "::endgroup::"
            done
          done <<< "$devices"
          exit $status

      # The replay build (#57) compiles too, so the code only it holds does not rot: for the epix Pro
      # (Gen 2) 47 mm only, as it plays in the simulator and is never shipped. Its recording is never
      # in the repository (a climber's own track), so a two-entry stand-in is written here, in the
      # shape tools/fit2replay.py writes.
      - name: Build the replay variant
        env:
          HOME: /root
        run: |
          printf '[\n[30000,1000,null,null],\n[30010,1001,46.0,7.0]\n]\n' > resources-replay/replay.json
          make build REPLAY=1 DEVICE=epix2pro47mm SDK_BIN=/connectiq/bin DEV_KEY=/tmp/ci_key
          ls -l FerrataTime-replay.prg

  # The unit tests (#46), as Matrix Time runs them: a job of its own, so a red here is not read as a
  # compile failure. monkeydo pushes the test build into a running simulator, a GUI application;
  # the image carries the simulator and xvfb, and xvfb-run gives it a display. timeout-minutes,
  # because a hung monkeydo is this job's characteristic failure.
  test:
    name: unit tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    container:
      # The build job's digest, for its reasons; bump both together.
      image: ghcr.io/wkusnierczyk/connectiq-tester@sha256:43c0f915cf5dbb721c87dabf36bcb0109ce33d42414e05c9472b53bc0b14914e  # 9.3.0-2026-11-16
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The build job's three, and: netcat, which make sim probes the simulator's port with; xvfb,
      # named so the dependency is ours; xauth, which xvfb-run needs and xvfb only recommends.
      - name: Install make, git, git-lfs, netcat and xvfb
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make git git-lfs netcat-openbsd xvfb xauth

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - name: Generate a throwaway signing key
        run: |
          openssl genrsa -out /tmp/ci_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in /tmp/ci_key.pem -out /tmp/ci_key -nocrypt

      # The whole of make test runs under xvfb-run, since it starts the simulator (make sim) and the
      # simulator must see the same display. make test gates on the anchored "PASSED (" line, not on
      # monkeydo's exit status, which is 1 either way. HOME and DEVICE as in the build job.
      #
      # Then again in the replay build (#57), on the build job's stand-in recording, so the code only
      # that build holds (loading the recording, its nulls) runs, not only compiles; and in the demo
      # app's build (#140), whose tests hold that it plays the demo. All under one xvfb-run, so the later
      # runs reuse the simulator the first started on the same display.
      - name: Run the unit tests, and again in the replay build and the demo app's
        timeout-minutes: 10
        env:
          HOME: /root
        run: |
          printf '[\n[30000,1000,null,null],\n[30010,1001,46.0,7.0]\n]\n' > resources-replay/replay.json
          xvfb-run -a sh -c '
            make test DEVICE=epix2pro47mm SDK_BIN=/connectiq/bin DEV_KEY=/tmp/ci_key &&
            make test REPLAY=1 DEVICE=epix2pro47mm SDK_BIN=/connectiq/bin DEV_KEY=/tmp/ci_key &&
            make test DEMO=1 DEVICE=epix2pro47mm SDK_BIN=/connectiq/bin DEV_KEY=/tmp/ci_key'
