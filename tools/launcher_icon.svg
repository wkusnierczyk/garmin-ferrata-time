<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" color="#ff6f3c">
  <!-- Proposal B, "Top out" (owner, 2026-11-22): Garmin's Activities figure, arms up in a V, clipped
       to the via ferrata cable beside it. Garmin's figure style: a round head and filled limbs that
       narrow away from the body, each limb a chain of circles joined by their outer tangents. The
       harness is the gap cut at the waist; the lanyard runs from it to a carabiner on the cable.
       Drawn from the icon mock (workspace .dev/mocks/icons/icons.html). -->
