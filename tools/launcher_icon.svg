    <mask id="harness" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <line x1="25" y1="53" x2="52" y2="57" stroke="#000" stroke-width="3.5"/>
    </mask>
  </defs>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 3V97" stroke-width="5"/>
    <path d="M60 80H76" stroke-width="6"/>
    <circle cx="43" cy="15" r="10" fill="currentColor" stroke="none"/>
    <path d="M43 11L59 12.5" stroke-width="5"/>
    <g mask="url(#harness)">
      <path d="M42 32L38 57" stroke-width="15"/>
      <path d="M38 59L53 67L63 78" stroke-width="11"/>
      <path d="M37 59L32 78L40 94" stroke-width="11"/>
    </g>
    <path d="M46 35L60 30L72 22" stroke-width="10"/>
    <path d="M41 55L70 50" stroke-width="4.5"/>
