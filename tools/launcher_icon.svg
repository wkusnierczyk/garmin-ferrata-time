<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" color="#ff6f3c">
  <!-- A climber clipped to a via ferrata cable: the cable, a rung, then the climber.
       The helmet is only its visor; the harness is the gap cut at the waist. -->
